services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agrocare
      POSTGRES_PASSWORD: agrocare
      POSTGRES_DB: agrocare
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrocare"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads, ./models:/models]
volumes:
  pgdata:
  uploads:
